<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy Bot - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .session-info {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .message-bubble {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 8px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }

        input[type="text"] {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 4px;
            justify-content: flex-start;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Study Buddy Bot</h1>
            <div class="session-info">
                <span id="sessionId">Session: Chưa bắt đầu</span> | 
                <span id="timeRemaining">Thời gian: --</span>
            </div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Nhập tin nhắn của bạn..."
                disabled
            >
            <button id="sendBtn" disabled>Gửi</button>
            <button id="startBtn">Bắt đầu</button>
        </div>
    </div>

    <script>
        // Auto-detect API URL - use localhost for development, production URL for deployed
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://boteng-6380.onrender.com';
        
        console.log('🔗 API URL:', API_URL);
        
        let sessionId = null;
        let isLoading = false;
        let sessionTimer = null;

        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const startBtn = document.getElementById('startBtn');
        const sessionInfo = document.getElementById('sessionId');
        const timeInfo = document.getElementById('timeRemaining');

        // Start session
        startBtn.addEventListener('click', startSession);
        
        // Send message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) sendMessage();
        });

        async function startSession() {
            try {
                isLoading = true;
                startBtn.disabled = true;
                addMessage('System', 'Đang kết nối...', 'bot');

                const response = await fetch(`${API_URL}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Lỗi kết nối');

                const data = await response.json();
                sessionId = data.sessionId;

                chatArea.innerHTML = '';
                addMessage('Bot', data.message, 'bot');
                
                sessionInfo.textContent = `Session: ${sessionId.substring(0, 20)}...`;
                timeInfo.textContent = `Thời gian: ${data.timeLimit}s`;

                messageInput.disabled = false;
                sendBtn.disabled = false;
                startBtn.disabled = false;
                messageInput.focus();

                startTimer(data.timeLimit);
            } catch (error) {
                addMessage('Error', error.message, 'error');
                startBtn.disabled = false;
            } finally {
                isLoading = false;
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !sessionId || isLoading) return;

            try {
                isLoading = true;
                messageInput.value = '';
                sendBtn.disabled = true;

                addMessage('Bạn', message, 'user');
                showLoading();

                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, message })
                });

                if (!response.ok) throw new Error('Lỗi gửi tin nhắn');

                const data = await response.json();
                
                // Remove loading indicator
                chatArea.querySelector('.loading')?.parentElement?.remove();
                
                addMessage('Bot', data.botMessage, 'bot');
                timeInfo.textContent = `Thời gian: ${data.timeRemaining?.toFixed(0)}s`;

                if (data.isEnded) {
                    endSession();
                } else {
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            } catch (error) {
                addMessage('Error', error.message, 'error');
                sendBtn.disabled = false;
            } finally {
                isLoading = false;
            }
        }

        function addMessage(sender, text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type === 'user' ? 'user' : ''}`;
            
            if (type === 'error') {
                messageDiv.innerHTML = `<div class="error">${text}</div>`;
            } else if (type === 'success') {
                messageDiv.innerHTML = `<div class="success">${text}</div>`;
            } else {
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                
                const timestamp = document.createElement('div');
                timestamp.className = 'timestamp';
                timestamp.textContent = new Date().toLocaleTimeString('vi-VN');
                
                messageDiv.appendChild(bubble);
                messageDiv.appendChild(timestamp);
            }
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showLoading() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function startTimer(duration) {
            let remaining = duration;
            clearInterval(sessionTimer);
            
            sessionTimer = setInterval(() => {
                remaining--;
                timeInfo.textContent = `Thời gian: ${remaining}s`;
                
                if (remaining <= 0) {
                    clearInterval(sessionTimer);
                    endSession();
                }
            }, 1000);
        }

        function endSession() {
            clearInterval(sessionTimer);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            startBtn.disabled = false;
            addMessage('System', '⏱️ Phiên hội thoại đã kết thúc', 'success');
            sessionId = null;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(sessionTimer);
        });
    </script>
</body>
</html>
